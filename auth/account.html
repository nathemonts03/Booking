<!-- Security: same rules as the landing page, plus the Firebase hosts this page needs -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com https://*.firebasedatabase.app wss://*.firebasedatabase.app https://*.firebaseio.com wss://*.firebaseio.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Log in or sign up | The Court Club</title>
<meta name="description" content="Log in or create an account to book a pickleball court at The Court Club in Cebu.">
<meta name="robots" content="noindex">

<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#F5F7F2">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">

<!-- Theme + motion flags before first paint, plus a safety net so a form can never
     submit natively (which would put a password in the address bar) -->
<script>
(function () {
  if (window.top !== window.self) {
    try { window.top.location = window.self.location.href; } catch (e) { document.documentElement.style.display = 'none'; }
  }
  document.addEventListener('submit', function (e) { e.preventDefault(); }, true);
  var root = document.documentElement, dark = false;
  root.classList.add('js');
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) root.classList.add('no-motion');
  try {
    var saved = localStorage.getItem('tcc-theme');
    dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  } catch (e) {
    dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  root.dataset.theme = dark ? 'dark' : 'light';
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', dark ? '#0A171D' : '#F5F7F2');
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&display=swap" rel="stylesheet">

<style>
/* ------------------------------------------------------------------
   Tokens (identical to the landing page)
------------------------------------------------------------------ */
:root {
  color-scheme: light;
  --bg: #F5F7F2;
  --surface: #FFFFFF;
  --ink: #10222B;
  --ink-soft: #456069;
  --line: rgba(16, 34, 43, .16);
  --court: #2456C7;
  --kitchen: #1B7F6E;
  --band: #1F4DBA;
  --ball: #F4D03F;
  --on-ball: #10222B;
  --focus: #2456C7;
  --danger: #B3261E;
  --ok: #1B7F6E;
  --ease-out: cubic-bezier(.2, .8, .2, 1);
  --ease-spring: cubic-bezier(.34, 1.56, .64, 1);
  --font-sans: "Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0A171D;
  --surface: #11252D;
  --ink: #EAF2EE;
  --ink-soft: #9FB6BE;
  --line: rgba(234, 242, 238, .16);
  --court: #3B72E8;
  --kitchen: #17786A;
  --band: #1B3F94;
  --focus: #F4D03F;
  --danger: #FF8A80;
  --ok: #5FD1BC;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100dvh;
  background: var(--bg); color: var(--ink);
  font-family: var(--font-sans); font-size: 1.0625rem; line-height: 1.55;
  -webkit-font-smoothing: antialiased; overflow-x: clip;
}
img, svg { max-width: 100%; }
h1, p { margin-top: 0; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 6px; }
[hidden] { display: none !important; }

.wrap { width: min(1180px, 100% - 2.5rem); margin-inline: auto; }
.skip {
  position: absolute; left: 1rem; top: -4rem; z-index: 100;
  background: var(--ball); color: var(--on-ball); font-weight: 700;
  padding: .6rem 1rem; border-radius: 999px; text-decoration: none;
}
.skip:focus { top: 1rem; }

/* ------------------------------------------------------------------
   Buttons
------------------------------------------------------------------ */
.btn {
  position: relative; overflow: hidden; isolation: isolate;
  display: inline-flex; align-items: center; justify-content: center; gap: .6rem;
  font: inherit; font-weight: 700; line-height: 1.1;
  padding: .85rem 1.5rem; border: 0; border-radius: 999px;
  background: var(--ball); color: var(--on-ball);
  text-decoration: none; cursor: pointer;
  transition: transform .25s var(--ease-spring), box-shadow .25s ease, opacity .2s;
}
.btn::after {
  content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background: linear-gradient(105deg, transparent 32%, rgba(255, 255, 255, .6) 50%, transparent 68%);
  transform: translateX(-130%);
}
.btn:hover:not(:disabled) { transform: translateY(-2px) scale(1.02); box-shadow: 0 14px 26px -14px rgba(0, 0, 0, .6); }
.btn:hover:not(:disabled)::after { transform: translateX(130%); transition: transform .7s var(--ease-out); }
.btn:active:not(:disabled) { transform: translateY(0) scale(.98); }
.btn:disabled { cursor: not-allowed; opacity: .65; }
.btn-block { width: 100%; padding: 1rem 1.5rem; font-size: 1.05rem; }
.spin {
  display: none; width: 1.1rem; height: 1.1rem; border-radius: 50%;
  border: 2.5px solid rgba(16, 34, 43, .25); border-top-color: var(--on-ball);
  animation: spin .7s linear infinite;
}
.btn.loading .spin { display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ------------------------------------------------------------------
   Top bar
------------------------------------------------------------------ */
.top {
  position: sticky; top: 0; z-index: 50;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  -webkit-backdrop-filter: saturate(1.4) blur(14px); backdrop-filter: saturate(1.4) blur(14px);
  border-bottom: 1px solid var(--line);
  padding-top: env(safe-area-inset-top);
}
.bar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; min-height: 4rem; }
.brand { display: inline-flex; align-items: center; gap: .65rem; text-decoration: none; font-weight: 700; font-size: 1.15rem; letter-spacing: -.01em; }
.brand svg { width: 2.15rem; height: 2.15rem; flex: none; transition: transform .5s var(--ease-spring); }
.brand:hover svg { transform: rotate(-12deg) scale(1.1); }
.actions { display: flex; align-items: center; gap: .9rem; }
.back { font-weight: 500; color: var(--ink-soft); text-decoration: none; }
.back:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }
.theme-toggle {
  width: 2.6rem; height: 2.6rem; display: grid; place-items: center;
  border-radius: 50%; border: 0; cursor: pointer;
  background: transparent; color: var(--ink);
  box-shadow: inset 0 0 0 1.5px var(--line);
  transition: box-shadow .2s ease, transform .25s var(--ease-spring);
}
.theme-toggle:hover { box-shadow: inset 0 0 0 1.5px var(--ink); transform: rotate(-14deg); }
.theme-toggle:active { transform: scale(.88); }
.theme-toggle svg { width: 1.25rem; height: 1.25rem; }
.theme-toggle .sun { display: none; }
:root[data-theme="dark"] .theme-toggle .sun { display: block; }
:root[data-theme="dark"] .theme-toggle .moon { display: none; }
.theme-toggle.spin-icon svg { animation: iconin .65s var(--ease-spring); }
@keyframes iconin { from { transform: rotate(-140deg) scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
::view-transition-old(root) { z-index: 1; }
::view-transition-new(root) { z-index: 2; }

/* ------------------------------------------------------------------
   Layout
------------------------------------------------------------------ */
.shell {
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 2rem;
  align-items: center;
  padding: clamp(1.5rem, 5vw, 3.5rem) 0 clamp(2.5rem, 6vw, 4.5rem);
}
@media (min-width: 900px) {
  .shell { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 4rem; min-height: calc(100dvh - 4.2rem); }
}

/* Blue court-line panel (desktop only) */
.art {
  display: none; position: relative; overflow: hidden;
  min-height: 34rem; height: 100%;
  border-radius: 28px; background: var(--band); color: #fff;
  padding: clamp(2rem, 4vw, 3rem);
  align-items: flex-end;
}
@media (min-width: 900px) { .art { display: flex; } }
.art::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    linear-gradient(90deg, transparent calc(20% - 1px), rgba(255,255,255,.2) calc(20% - 1px), rgba(255,255,255,.2) calc(20% + 1px), transparent calc(20% + 1px)),
    linear-gradient(90deg, transparent calc(80% - 1px), rgba(255,255,255,.2) calc(80% - 1px), rgba(255,255,255,.2) calc(80% + 1px), transparent calc(80% + 1px)),
    linear-gradient(90deg, transparent calc(50% - 1px), rgba(255,255,255,.12) calc(50% - 1px), rgba(255,255,255,.12) calc(50% + 1px), transparent calc(50% + 1px)),
    linear-gradient(0deg, transparent calc(50% - 1px), rgba(255,255,255,.2) calc(50% - 1px), rgba(255,255,255,.2) calc(50% + 1px), transparent calc(50% + 1px));
}
.art p {
  position: relative; margin: 0; max-width: 12ch;
  font-size: clamp(2.2rem, 4.4vw, 3.6rem); font-weight: 700; font-stretch: 88%;
  line-height: 1.02; letter-spacing: -.03em; text-wrap: balance;
}
.art p span { display: block; color: var(--ball); }

/* ------------------------------------------------------------------
   Card
------------------------------------------------------------------ */
.card {
  position: relative; overflow: hidden;
  width: 100%; max-width: 34rem; justify-self: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: 28px;
  padding: 2rem 1.5rem 1.75rem;
  box-shadow: 0 40px 80px -40px rgba(0, 0, 0, .55);
}
@media (min-width: 560px) { .card { padding: 2.25rem 2.25rem 2rem; } }
.card::before {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .7;
  background:
    linear-gradient(90deg, transparent calc(88% - 1px), var(--line) calc(88% - 1px), var(--line) calc(88% + 1px), transparent calc(88% + 1px)),
    linear-gradient(0deg, transparent calc(90% - 1px), var(--line) calc(90% - 1px), var(--line) calc(90% + 1px), transparent calc(90% + 1px));
}
.card > * { position: relative; }

.ball-mark { position: relative; width: 2.6rem; height: 3.2rem; margin-bottom: .5rem; }
.mb {
  position: absolute; left: 0; bottom: .55rem; width: 2.4rem; height: 2.4rem; border-radius: 50%;
  background: radial-gradient(circle at 32% 30%, #FFEA85, var(--ball) 55%, #D3AC00);
}
.mb-shadow { position: absolute; left: .15rem; bottom: .25rem; width: 2.1rem; height: .5rem; border-radius: 50%; background: rgba(0, 0, 0, .22); }

.tabs {
  display: grid; grid-template-columns: 1fr 1fr; gap: .25rem; padding: .3rem;
  background: var(--bg); border: 1px solid var(--line); border-radius: 999px;
  margin-bottom: 1.5rem;
}
.tab {
  font: inherit; font-weight: 650; padding: .6rem 1rem; border: 0; border-radius: 999px;
  background: transparent; color: var(--ink-soft); cursor: pointer;
  transition: background .25s ease, color .2s, transform .25s var(--ease-spring);
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { background: var(--ball); color: var(--on-ball); }
.tab:active { transform: scale(.97); }

h1 {
  font-size: clamp(2rem, 5.4vw, 2.7rem);
  font-weight: 700; font-stretch: 90%;
  line-height: 1.02; letter-spacing: -.03em;
  margin-bottom: .5rem; text-wrap: balance;
}
.sub { color: var(--ink-soft); margin-bottom: 1.5rem; text-wrap: pretty; }

.msg {
  display: flex; gap: .6rem; align-items: flex-start;
  margin: 0 0 1.25rem; padding: .8rem 1rem; border-radius: 14px;
  font-size: .97rem; line-height: 1.4;
  border: 1.5px solid currentColor;
  background: color-mix(in srgb, currentColor 9%, transparent);
}
.msg.error { color: var(--danger); }
.msg.success { color: var(--ok); }
.msg span { color: var(--ink); }

/* ------------------------------------------------------------------
   Forms
------------------------------------------------------------------ */
form { display: grid; gap: 1rem; }
.field label { display: block; font-size: .85rem; font-weight: 600; color: var(--ink-soft); margin: 0 0 .3rem .15rem; transition: color .2s; }
.field:focus-within label { color: var(--ink); }
.field input[type="email"], .field input[type="tel"], .field input[type="password"], .field input[type="text"] {
  display: block; width: 100%; min-width: 0;
  font: inherit; font-size: 1rem; height: 3rem; padding: 0 .85rem;
  color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 12px;
  transition: border-color .2s, box-shadow .25s, transform .25s var(--ease-spring);
}
.field input:hover { border-color: var(--ink-soft); }
.field input:focus { border-color: var(--court); box-shadow: 0 0 0 4px color-mix(in srgb, var(--court) 25%, transparent); transform: translateY(-1px); outline: none; }
.field.invalid input { border-color: var(--danger); }
.field.invalid input:focus { box-shadow: 0 0 0 4px color-mix(in srgb, var(--danger) 25%, transparent); }
.hint { margin: .3rem 0 0 .15rem; font-size: .85rem; color: var(--ink-soft); }
.err { margin: .3rem 0 0 .15rem; font-size: .88rem; font-weight: 500; color: var(--danger); }
.err:empty { display: none; }

.pw { position: relative; }
.pw input { padding-right: 3.2rem !important; }
.eye {
  position: absolute; right: .3rem; top: 50%; transform: translateY(-50%);
  width: 2.4rem; height: 2.4rem; display: grid; place-items: center;
  border: 0; border-radius: 50%; background: transparent; color: var(--ink-soft); cursor: pointer;
  transition: color .2s, background .2s;
}
.eye:hover { color: var(--ink); background: color-mix(in srgb, var(--ink) 8%, transparent); }
.eye svg { width: 1.3rem; height: 1.3rem; }
.eye .off, .eye[aria-pressed="true"] .on { display: none; }
.eye[aria-pressed="true"] .off { display: block; }

.row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.check { display: inline-flex; align-items: center; gap: .55rem; cursor: pointer; font-weight: 500; user-select: none; }
.check input { width: 1.2rem; height: 1.2rem; margin: 0; accent-color: var(--court); cursor: pointer; }
.linkbtn {
  font: inherit; font-weight: 600; padding: .25rem 0; border: 0; background: none; cursor: pointer;
  color: var(--ink); text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--line);
  transition: text-decoration-color .2s;
}
.linkbtn:hover { text-decoration-color: var(--ink); }
.switch { margin: 1.25rem 0 0; text-align: center; color: var(--ink-soft); font-size: .97rem; }

.noscript { margin: 0 0 1rem; color: var(--danger); font-weight: 600; }

/* ------------------------------------------------------------------
   Motion (skipped for reduced-motion visitors)
------------------------------------------------------------------ */
@media (prefers-reduced-motion: no-preference) {
  .card { animation: pop-in .6s var(--ease-spring) backwards; }
  .mb { animation: bounce 1.1s cubic-bezier(.3, 0, .4, 1) .3s both; }
  .mb-shadow { animation: shade 1.1s ease-in .3s both; }
  form.enter { animation: rise .45s var(--ease-out) backwards; }
  .msg { animation: rise .35s var(--ease-out) backwards; }
}
@keyframes pop-in { from { opacity: 0; transform: translateY(36px) scale(.94); } to { opacity: 1; transform: none; } }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes bounce {
  0%   { transform: translateY(-46px); opacity: 0; }
  12%  { opacity: 1; }
  40%  { transform: translateY(0); }
  56%  { transform: translateY(-16px); }
  70%  { transform: translateY(0); }
  84%  { transform: translateY(-5px); }
  100% { transform: translateY(0); }
}
@keyframes shade {
  0%   { opacity: 0; transform: scale(.4); }
  42%  { opacity: 1; transform: scale(1); }
  58%  { transform: scale(.75); }
  72%  { transform: scale(1); }
  84%  { transform: scale(.9); }
  100% { transform: scale(1); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<body>
<a class="skip" href="#main">Skip to form</a>

<!-- Shared icons + logo -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="mark" viewBox="0 0 48 48">
    <rect width="48" height="48" rx="12" fill="#2456C7"/>
    <g fill="none" stroke="#fff" stroke-width="2">
      <rect x="8" y="14" width="32" height="20"/>
      <path d="M16 14v20M32 14v20M8 24h8M32 24h8"/>
      <path d="M24 12v24" stroke-opacity=".7"/>
    </g>
    <circle cx="35" cy="19" r="4.4" fill="#F4D03F"/>
  </symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.5 6.6A17 17 0 0 0 2 12s3.5 7 10 7a10 10 0 0 0 4.5-1.1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></symbol>
</svg>

<header class="top">
  <div class="wrap bar">
    <a class="brand" href="../" aria-label="The Court Club, home">
      <svg aria-hidden="true"><use href="#mark"/></svg>
      <span>The Court Club</span>
    </a>
    <div class="actions">
      <a class="back" href="../">Back to site</a>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="main" class="wrap shell">

  <aside class="art" aria-hidden="true">
    <p>Your court is waiting. <span>The family just got a little bigger.</span></p>
  </aside>

  <section class="card" aria-labelledby="title">
    <div class="ball-mark" aria-hidden="true"><span class="mb-shadow"></span><span class="mb"></span></div>

    <noscript><p class="noscript">This page needs JavaScript to log you in.</p></noscript>

    <div class="tabs" id="tabs" role="tablist" aria-label="Account">
      <button class="tab" id="tab-login" role="tab" type="button" aria-selected="true" aria-controls="form-login">Log in</button>
      <button class="tab" id="tab-signup" role="tab" type="button" aria-selected="false" aria-controls="form-signup" tabindex="-1">Sign up</button>
    </div>

    <h1 id="title">Welcome back.</h1>
    <p class="sub" id="sub">Log in to see and manage your bookings.</p>

    <div class="msg" id="msg" role="alert" hidden><span id="msg-text"></span></div>

    <!-- LOG IN -->
    <form id="form-login" class="enter" novalidate aria-labelledby="tab-login" role="tabpanel">
      <div class="field">
        <label for="l-email">Email</label>
        <input id="l-email" name="email" type="email" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" aria-describedby="l-email-err">
        <p class="err" id="l-email-err"></p>
      </div>
      <div class="field">
        <label for="l-pass">Password</label>
        <div class="pw">
          <input id="l-pass" name="password" type="password" autocomplete="current-password" aria-describedby="l-pass-err">
          <button class="eye" type="button" data-eye="l-pass" aria-label="Show password" aria-pressed="false" aria-controls="l-pass">
            <svg class="on" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-eye"/></svg>
            <svg class="off" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-eye-off"/></svg>
          </button>
        </div>
        <p class="err" id="l-pass-err"></p>
      </div>
      <div class="row">
        <label class="check"><input type="checkbox" id="l-remember"> Remember me</label>
        <button class="linkbtn" type="button" id="to-forgot">Forgot password?</button>
      </div>
      <button class="btn btn-block" type="submit"><span class="label">Log in</span><span class="spin" aria-hidden="true"></span></button>
      <p class="switch" style="margin:0">New here? <button class="linkbtn" type="button" data-go="signup">Create an account</button></p>
    </form>

    <!-- SIGN UP -->
    <form id="form-signup" class="enter" novalidate hidden aria-labelledby="tab-signup" role="tabpanel">
      <div class="field">
        <label for="s-email">Email</label>
        <input id="s-email" name="email" type="email" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" aria-describedby="s-email-err">
        <p class="err" id="s-email-err"></p>
      </div>
      <div class="field">
        <label for="s-phone">Contact number</label>
        <input id="s-phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="0917 123 4567" aria-describedby="s-phone-err">
        <p class="err" id="s-phone-err"></p>
      </div>
      <div class="field">
        <label for="s-pass">Password</label>
        <div class="pw">
          <input id="s-pass" name="password" type="password" autocomplete="new-password" aria-describedby="s-pass-hint s-pass-err">
          <button class="eye" type="button" data-eye="s-pass" aria-label="Show password" aria-pressed="false" aria-controls="s-pass">
            <svg class="on" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-eye"/></svg>
            <svg class="off" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-eye-off"/></svg>
          </button>
        </div>
        <p class="hint" id="s-pass-hint">At least 8 characters.</p>
        <p class="err" id="s-pass-err"></p>
      </div>
      <div class="field">
        <label for="s-pass2">Confirm password</label>
        <div class="pw">
          <input id="s-pass2" name="password2" type="password" autocomplete="new-password" aria-describedby="s-pass2-err">
          <button class="eye" type="button" data-eye="s-pass2" aria-label="Show password" aria-pressed="false" aria-controls="s-pass2">
            <svg class="on" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-eye"/></svg>
            <svg class="off" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-eye-off"/></svg>
          </button>
        </div>
        <p class="err" id="s-pass2-err"></p>
      </div>
      <button class="btn btn-block" type="submit"><span class="label">Create account</span><span class="spin" aria-hidden="true"></span></button>
      <p class="switch" style="margin:0">Already have an account? <button class="linkbtn" type="button" data-go="login">Log in</button></p>
    </form>

    <!-- FORGOT PASSWORD -->
    <form id="form-forgot" class="enter" novalidate hidden>
      <div class="field">
        <label for="r-email">Email</label>
        <input id="r-email" name="email" type="email" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" aria-describedby="r-email-err">
        <p class="err" id="r-email-err"></p>
      </div>
      <button class="btn btn-block" type="submit"><span class="label">Send reset link</span><span class="spin" aria-hidden="true"></span></button>
      <p class="switch" style="margin:0"><button class="linkbtn" type="button" data-go="login">Back to log in</button></p>
    </form>
  </section>
</main>

<script type="module">
/* ------------------------------------------------------------------
   Firebase project settings (from your Firebase console)
------------------------------------------------------------------ */
const firebaseConfig = {
  apiKey: "AIzaSyBWeLeh0a2PpGpxHk8DFup-rNiFmfjvaWI",
  authDomain: "pickleballsystem-729d3.firebaseapp.com",
  databaseURL: "https://pickleballsystem-729d3-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "pickleballsystem-729d3",
  storageBucket: "pickleballsystem-729d3.firebasestorage.app",
  messagingSenderId: "352709442404",
  appId: "1:352709442404:web:5bb00d7a77036c55d61871",
  measurementId: "G-QBWPK4B56G"
};

const FIREBASE_VERSION = '11.10.0';
const FALLBACK_NEXT = '../book/';        // where to go after login if no ?next= is given
const REMEMBER_KEY = 'tcc-remember-email';
const HINT_KEY = 'tcc-signed-in';        // harmless hint the landing page reads (not security)

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const root = document.documentElement;
const noMotion = root.classList.contains('no-motion');

/* ------------------------------------------------------------------
   Firebase loads in the background. If it can't load (offline, blocked),
   the page still works and shows a clear message on submit.
------------------------------------------------------------------ */
let fb = null;
let busy = false;

const fbReady = (async () => {
  try {
    const base = 'https://www.gstatic.com/firebasejs/' + FIREBASE_VERSION + '/';
    const [appM, authM, dbM] = await Promise.all([
      import(base + 'firebase-app.js'),
      import(base + 'firebase-auth.js'),
      import(base + 'firebase-database.js')
    ]);
    const app = appM.initializeApp(firebaseConfig);
    /* initializeAuth (not getAuth) keeps the popup/redirect iframe out of the page */
    const auth = authM.initializeAuth(app, {
      persistence: [authM.indexedDBLocalPersistence, authM.browserLocalPersistence, authM.browserSessionPersistence]
    });
    const db = dbM.getDatabase(app);
    fb = { authM, dbM, auth, db };
    authM.onAuthStateChanged(auth, onAuthChange);
  } catch (err) {
    console.error('Firebase failed to load', err);
  }
})();

async function needFirebase() {
  await fbReady;
  if (!fb) { const e = new Error('Firebase unavailable'); e.code = 'app/unavailable'; throw e; }
  return fb;
}

/* ------------------------------------------------------------------
   Helpers
------------------------------------------------------------------ */
/* Only ever redirect to pages on this site (blocks open redirects) */
function sameSiteUrl(url, fallback) {
  try {
    const u = new URL(url || fallback, location.href);
    if (u.origin !== location.origin) throw 0;
    return u;
  } catch (e) { return new URL(fallback, location.href); }
}
const params = new URLSearchParams(location.search);
const nextUrl = sameSiteUrl(params.get('next'), FALLBACK_NEXT);
function goNext() { location.replace(nextUrl.pathname + nextUrl.search + nextUrl.hash); }

function setHint(on) {
  try { on ? localStorage.setItem(HINT_KEY, '1') : localStorage.removeItem(HINT_KEY); } catch (e) {}
}

function onAuthChange(user) {
  if (user) {
    setHint(true);
    if (!busy) { showMsg('success', 'You are already logged in. Taking you to booking…'); goNext(); }
  } else {
    setHint(false);
  }
}

const EMAIL_RE = /^[^\s@<>"]+@[^\s@<>"]+\.[^\s@<>"]+$/;
const PHONE_RE = /^\+?\d{7,15}$/;

const ERRORS = {
  'auth/invalid-credential': 'The email or password is incorrect.',
  'auth/wrong-password': 'The email or password is incorrect.',
  'auth/user-not-found': 'The email or password is incorrect.',
  'auth/invalid-email': 'Enter a valid email address.',
  'auth/email-already-in-use': 'An account with this email already exists. Log in instead.',
  'auth/weak-password': 'Choose a stronger password with at least 8 characters.',
  'auth/too-many-requests': 'Too many attempts. Wait a few minutes, or reset your password.',
  'auth/network-request-failed': 'Cannot reach the server. Check your connection and try again.',
  'auth/user-disabled': 'This account has been disabled. Contact the club for help.',
  'auth/operation-not-allowed': 'Email sign-in is not turned on yet. Enable Email/Password in the Firebase console.',
  'app/unavailable': 'Sign-in is not available right now. Check your connection and reload the page.'
};
const friendly = err => ERRORS[err && err.code] || 'Something went wrong. Try again.';

/* Messages (textContent only, so nothing can inject markup) */
const msgBox = $('#msg'), msgText = $('#msg-text');
function showMsg(kind, text) {
  msgBox.className = 'msg ' + kind;
  msgText.textContent = text;
  msgBox.hidden = false;
}
function clearMsg() { msgBox.hidden = true; msgText.textContent = ''; }

/* Field errors */
function fieldErr(input, text) {
  const box = input.closest('.field');
  box.querySelector('.err').textContent = text || '';
  box.classList.toggle('invalid', !!text);
  input.setAttribute('aria-invalid', text ? 'true' : 'false');
}
function validate(rules) {
  let first = null;
  rules.forEach(([input, text]) => { fieldErr(input, text || ''); if (text && !first) first = input; });
  if (first) first.focus();
  return !first;
}
$$('input').forEach(i => i.addEventListener('input', () => { if (i.closest('.field')) fieldErr(i, ''); }));

/* Busy state on the submit button */
const setLabel = (btn, text) => { btn.querySelector('.label').textContent = text; };
function setBusy(form, on) {
  busy = on;
  const btn = $('button[type="submit"]', form);
  btn.disabled = on;
  btn.classList.toggle('loading', on);
  btn.setAttribute('aria-busy', on ? 'true' : 'false');
}

/* ------------------------------------------------------------------
   Views: log in / sign up / forgot password
------------------------------------------------------------------ */
const VIEWS = {
  login:  { form: $('#form-login'),  title: 'Welcome back.',          sub: 'Log in to see and manage your bookings.' },
  signup: { form: $('#form-signup'), title: 'Join the club.',         sub: 'Create an account to keep your bookings in one place.' },
  forgot: { form: $('#form-forgot'), title: 'Forgot your password?',  sub: 'Enter your email and we will send you a link to choose a new one.' }
};
const tabs = { login: $('#tab-login'), signup: $('#tab-signup') };
let current = 'login';

function resetPasswordFields() {
  $$('[data-eye]').forEach(b => {
    const input = document.getElementById(b.dataset.eye);
    input.type = 'password';
    b.setAttribute('aria-pressed', 'false');
    b.setAttribute('aria-label', 'Show password');
  });
}

function showView(name, opts = {}) {
  current = name;
  Object.entries(VIEWS).forEach(([key, v]) => { v.form.hidden = key !== name; });
  $('#tabs').hidden = name === 'forgot';
  Object.entries(tabs).forEach(([key, t]) => {
    t.setAttribute('aria-selected', key === name ? 'true' : 'false');
    t.tabIndex = key === name ? 0 : -1;
  });
  $('#title').textContent = VIEWS[name].title;
  $('#sub').textContent = VIEWS[name].sub;
  clearMsg();
  resetPasswordFields();
  $$('input').forEach(i => { if (i.closest('.field')) fieldErr(i, ''); });

  const form = VIEWS[name].form;
  form.classList.remove('enter'); void form.offsetWidth; form.classList.add('enter');

  if (name !== 'forgot') {
    const u = new URL(location.href); u.searchParams.set('mode', name);
    history.replaceState(null, '', u);
  }
  if (opts.focus) {
    const target = opts.focus === 'tab' ? tabs[name] : $('input', form);
    if (target) target.focus();
  }
}

tabs.login.addEventListener('click', () => showView('login', { focus: 'tab' }));
tabs.signup.addEventListener('click', () => showView('signup', { focus: 'tab' }));
[tabs.login, tabs.signup].forEach(t => t.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    e.preventDefault();
    showView(current === 'login' ? 'signup' : 'login', { focus: 'tab' });
  }
}));
$$('[data-go]').forEach(b => b.addEventListener('click', () => showView(b.dataset.go, { focus: 'input' })));
$('#to-forgot').addEventListener('click', () => {
  const typed = $('#l-email').value.trim();
  showView('forgot', { focus: 'input' });
  if (typed) $('#r-email').value = typed;
});

/* Show / hide password */
$$('[data-eye]').forEach(b => b.addEventListener('click', () => {
  const input = document.getElementById(b.dataset.eye);
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  b.setAttribute('aria-pressed', show ? 'true' : 'false');
  b.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
}));

/* ------------------------------------------------------------------
   Log in
------------------------------------------------------------------ */
VIEWS.login.form.addEventListener('submit', async e => {
  e.preventDefault();
  if (busy) return;
  clearMsg();
  const email = $('#l-email').value.trim();
  const pw = $('#l-pass').value;
  const remember = $('#l-remember').checked;

  const ok = validate([
    [$('#l-email'), !email ? 'Enter your email.' : !EMAIL_RE.test(email) ? 'Enter a valid email address.' : ''],
    [$('#l-pass'), !pw ? 'Enter your password.' : '']
  ]);
  if (!ok) return;

  const form = VIEWS.login.form;
  setBusy(form, true);
  try {
    const f = await needFirebase();
    /* Remember me: keep the session across browser restarts, otherwise end it when the tab closes */
    await f.authM.setPersistence(f.auth, remember ? f.authM.browserLocalPersistence : f.authM.browserSessionPersistence);
    await f.authM.signInWithEmailAndPassword(f.auth, email, pw);
    try { remember ? localStorage.setItem(REMEMBER_KEY, email) : localStorage.removeItem(REMEMBER_KEY); } catch (err) {}
    setHint(true);
    showMsg('success', 'Logged in. Taking you to booking…');
    goNext();
  } catch (err) {
    console.error(err);
    showMsg('error', friendly(err));
    setBusy(form, false);
  }
});

/* ------------------------------------------------------------------
   Sign up (account in Firebase Auth, contact number in Realtime Database)
------------------------------------------------------------------ */
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);

VIEWS.signup.form.addEventListener('submit', async e => {
  e.preventDefault();
  if (busy) return;
  clearMsg();
  const email = $('#s-email').value.trim();
  const phoneRaw = $('#s-phone').value.trim();
  const phone = phoneRaw.replace(/[\s\-().]/g, '');
  const pw = $('#s-pass').value;
  const pw2 = $('#s-pass2').value;

  const ok = validate([
    [$('#s-email'), !email ? 'Enter your email.' : !EMAIL_RE.test(email) ? 'Enter a valid email address.' : ''],
    [$('#s-phone'), !phoneRaw ? 'Enter your contact number.' : !PHONE_RE.test(phone) ? 'Use 7 to 15 digits, for example 0917 123 4567.' : ''],
    [$('#s-pass'), !pw ? 'Create a password.' : pw.length < 8 ? 'Use at least 8 characters.' : ''],
    [$('#s-pass2'), !pw2 ? 'Confirm your password.' : pw2 !== pw ? 'Passwords do not match.' : '']
  ]);
  if (!ok) return;

  const form = VIEWS.signup.form;
  setBusy(form, true);
  try {
    const f = await needFirebase();
    await f.authM.setPersistence(f.auth, f.authM.browserLocalPersistence);
    const cred = await f.authM.createUserWithEmailAndPassword(f.auth, email, pw);

    /* Save the contact number. The account already exists, so a failure here must not block the visitor. */
    try {
      await withTimeout(
        f.dbM.set(f.dbM.ref(f.db, 'users/' + cred.user.uid), {
          email: email,
          phone: phone,
          createdAt: f.dbM.serverTimestamp()
        }),
        8000
      );
    } catch (dbErr) {
      console.error('Contact number was not saved. Check your Realtime Database rules.', dbErr);
    }

    setHint(true);
    showMsg('success', 'Account created. Taking you to booking…');
    goNext();
  } catch (err) {
    console.error(err);
    showMsg('error', friendly(err));
    setBusy(form, false);
  }
});

/* ------------------------------------------------------------------
   Forgot password
------------------------------------------------------------------ */
function cooldown(btn, seconds) {
  const original = btn.dataset.label || 'Send reset link';
  let n = seconds;
  btn.disabled = true;
  setLabel(btn, 'Send again in ' + n + 's');
  const t = setInterval(() => {
    n--;
    if (n <= 0) { clearInterval(t); btn.disabled = false; setLabel(btn, original); }
    else setLabel(btn, 'Send again in ' + n + 's');
  }, 1000);
}

VIEWS.forgot.form.addEventListener('submit', async e => {
  e.preventDefault();
  if (busy) return;
  clearMsg();
  const email = $('#r-email').value.trim();
  const ok = validate([
    [$('#r-email'), !email ? 'Enter your email.' : !EMAIL_RE.test(email) ? 'Enter a valid email address.' : '']
  ]);
  if (!ok) return;

  const form = VIEWS.forgot.form;
  const btn = $('button[type="submit"]', form);
  btn.dataset.label = 'Send reset link';
  setBusy(form, true);
  try {
    const f = await needFirebase();
    await f.authM.sendPasswordResetEmail(f.auth, email);
  } catch (err) {
    /* Same answer whether or not the email has an account, so nobody can probe for members */
    if (err && err.code !== 'auth/user-not-found') {
      console.error(err);
      showMsg('error', friendly(err));
      setBusy(form, false);
      return;
    }
  }
  setBusy(form, false);
  showMsg('success', 'If ' + email + ' has an account, a reset link is on its way. Check your spam folder too.');
  cooldown(btn, 30);
});

/* ------------------------------------------------------------------
   Remember me: prefill the saved email
------------------------------------------------------------------ */
try {
  const saved = localStorage.getItem(REMEMBER_KEY);
  if (saved) { $('#l-email').value = saved; $('#l-remember').checked = true; }
} catch (e) {}

/* ------------------------------------------------------------------
   Theme toggle (shares the landing page's saved choice)
------------------------------------------------------------------ */
(function () {
  const btn = $('#theme-toggle');
  const meta = $('meta[name="theme-color"]');
  const colors = { light: '#F5F7F2', dark: '#0A171D' };

  function apply(theme, save) {
    root.dataset.theme = theme;
    if (meta) meta.setAttribute('content', colors[theme]);
    btn.setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
    if (save) { try { localStorage.setItem('tcc-theme', theme); } catch (e) {} }
  }
  apply(root.dataset.theme || 'light', false);

  btn.addEventListener('click', () => {
    const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
    if (!noMotion) { btn.classList.remove('spin-icon'); void btn.offsetWidth; btn.classList.add('spin-icon'); }
    if (noMotion || !document.startViewTransition) { apply(next, true); return; }
    const r = btn.getBoundingClientRect();
    const x = r.left + r.width / 2, y = r.top + r.height / 2;
    const end = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
    const t = document.startViewTransition(() => apply(next, true));
    t.ready.then(() => {
      root.animate(
        { clipPath: ['circle(0px at ' + x + 'px ' + y + 'px)', 'circle(' + end + 'px at ' + x + 'px ' + y + 'px)'] },
        { duration: 700, easing: 'cubic-bezier(.65, 0, .25, 1)', pseudoElement: '::view-transition-new(root)' }
      );
    }).catch(() => {});
  });

  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  mq.addEventListener && mq.addEventListener('change', e => {
    let saved = null;
    try { saved = localStorage.getItem('tcc-theme'); } catch (err) {}
    if (!saved) apply(e.matches ? 'dark' : 'light', false);
  });
})();   

/* ------------------------------------------------------------------
   Start on the right tab: ?mode=signup opens Sign up
------------------------------------------------------------------ */
const startMode = params.get('mode');
showView(startMode === 'signup' ? 'signup' : startMode === 'forgot' ? 'forgot' : 'login');
</script>
</body>
