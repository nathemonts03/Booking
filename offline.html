<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline | The Court Club</title>
    <style>
  :root { color-scheme: light dark; --bg:#F5F7F2; --ink:#10222B; --soft:#456069; --ball:#F4D03F; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0A171D; --ink:#EAF2EE; --soft:#9FB6BE; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:1.5rem; background:var(--bg); color:var(--ink);
         font-family: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif; line-height:1.5; }
  main { max-width: 28rem; }
  h1 { font-size: clamp(2rem, 8vw, 2.8rem); line-height:1.02; letter-spacing:-.03em; margin:0 0 .75rem; }
  p { color: var(--soft); margin:0 0 1.5rem; }
  a, button { display:inline-block; font:inherit; font-weight:700; padding:.85rem 1.5rem; border:0; border-radius:999px;
              background:var(--ball); color:#10222B; text-decoration:none; cursor:pointer; }
  a { margin-left:.5rem; background:transparent; color:var(--ink); box-shadow: inset 0 0 0 1.5px var(--soft); }
</style>
  </head>
  <body>
    <main>
      <h1>You're offline.</h1>
      <p>Booking needs a connection so you always see live court availability.
        Check your signal and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
      <a href="./">Back to home</a>
    </main>
  </body>
</html>
